<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI programs on the market — Catalog</title>
  <style>
    :root{
      --ink:#0d0f12; --panel:#15181d; --panel-2:#1b1f26; --line:#2a2f38;
      --paper:#ece6da; --amber:#e0a44a; --teal:#5fb0a5;
      font-family: system-ui, -apple-system, sans-serif;
    }
    body{color:var(--ink); background:#fff; margin:0; padding:0;}
    .container{max-width:1100px; margin:28px auto; padding:20px;}
    .article-grid{display:grid; grid-template-columns:1fr 260px; gap:28px;}
    .card{background:#f7f7f8; padding:14px; margin-bottom:12px; border-radius:8px; border:1px solid #e6e6e8;}
    .meta{font-size:0.9rem; color:#555;}
    .search{display:flex; gap:8px; margin-bottom:12px;}
    .filters button{margin-right:6px;}
    table{width:100%; border-collapse:collapse;}
    td,th{padding:10px; border-bottom:1px solid #eee;}
    .side{position:sticky; top:80px;}
    .sources{margin-top:28px; columns:2; column-gap:20px; font-size:0.95rem;}
    @media (max-width:760px){ .article-grid{grid-template-columns:1fr;} .side{position:relative; top:auto;} }
  </style>
</head>
<body>
  <nav class="topnav card" role="navigation">
    <div class="brand">MyBook — AI Catalog</div>
  </nav>

  <main class="container">
    <div class="article-grid">
      <section>
        <h1>AI programs on the market — catalog</h1>
        <p class="meta">Snapshot updated: <span id="snapshot-date">2026-07-16</span></p>

        <div class="card search" aria-hidden="false">
          <input id="q" placeholder="Search name, vendor, tags..." style="flex:1;padding:8px;border-radius:6px;border:1px solid #ddd">
          <div class="filters">
            <button data-cat="all" onclick="setCategory('all')">All</button>
            <button data-cat="conversational" onclick="setCategory('conversational')">Conversational</button>
            <button data-cat="code" onclick="setCategory('code')">Code</button>
            <button data-cat="image" onclick="setCategory('image')">Image/Video</button>
            <button data-cat="platform" onclick="setCategory('platform')">Platform</button>
            <button data-cat="content" onclick="setCategory('content')">Content</button>
          </div>
        </div>

        <section id="list">
          <!-- Items inserted here by JS -->
        </section>

        <div class="sources card">
          <h3>Sources & Further Reading</h3>
          <ol id="sources-list"></ol>
        </div>
      </section>

      <aside class="side card">
        <h4>In this catalog</h4>
        <ul>
          <li><a href="#list">All programs</a></li>
          <li><a href="#sources-list">Sources</a></li>
        </ul>
        <h4>Notes</h4>
        <p class="meta">Curated snapshot. For licensing or logos see vendor pages.</p>
      </aside>
    </div>
  </main>

  <script>
    // Populated dataset (initial research snapshot 2026-07-16)
    const data = [
      {name: "ChatGPT", vendor: "OpenAI", url: "https://chatgpt.com", category: "conversational", pricing: "Free tier / Plus / Enterprise", tags: "chat,assistant,general", desc: "Industry-leading conversational AI with multimodal capabilities, web browsing, and advanced reasoning. Powers millions of users worldwide."},
      {name: "Claude", vendor: "Anthropic", url: "https://claude.ai", category: "conversational", pricing: "Subscription / Enterprise", tags: "chat,assistant,safety", desc: "Advanced AI assistant known for thoughtful reasoning, long context windows (200k tokens), and safety-focused design. Available as web app and API."},
      {name: "Gemini", vendor: "Google", url: "https://gemini.google.com", category: "conversational", pricing: "Integrated into Google products / enterprise", tags: "multimodal,search,workspace", desc: "Google's multimodal AI model integrated into search, Gmail, and Workspace. Available in free and professional tiers with real-time web search."},
      {name: "Perplexity", vendor: "Perplexity", url: "https://www.perplexity.ai", category: "conversational", pricing: "Free / Pro", tags: "search,qa,citations", desc: "AI-powered answer engine combining conversational search with cited sources. Focus on accuracy and transparency with real-time web access."},
      {name: "Grok", vendor: "xAI (X)", url: "https://grok.x.ai", category: "conversational", pricing: "Integrated with X subscriptions", tags: "chat,real-time", desc: "Conversational assistant built by xAI with real-time knowledge from X (formerly Twitter). Available to X Premium subscribers."},

      {name: "GitHub Copilot", vendor: "GitHub (Microsoft)", url: "https://github.com/features/copilot", category: "code", pricing: "Personal / Business", tags: "ide,code,autocomplete", desc: "AI pair programmer that suggests code completions and generates functions. Integrated into VS Code, JetBrains IDEs, and Neovim."},
      {name: "Microsoft Copilot", vendor: "Microsoft", url: "https://copilot.microsoft.com", category: "code", pricing: "Included with Microsoft 365 / Windows subscriptions", tags: "productivity,office,code", desc: "Copilot integration across Microsoft products including Office, Windows, and VS Code. Helps with writing, analysis, and coding tasks."},
      {name: "Replit Ghostwriter", vendor: "Replit", url: "https://replit.com/ghostwriter", category: "code", pricing: "Subscription", tags: "ide,code", desc: "AI code assistant and project generator built into Replit. Generates complete projects and helps debug code in real-time."},
      {name: "Cursor", vendor: "Anysphere", url: "https://cursor.sh", category: "code", pricing: "Free / Subscription", tags: "ide,copilot,ai-native", desc: "AI-first code editor built on VS Code architecture. Features intelligent code generation, chat, and diff views."},

      {name: "Midjourney", vendor: "Midjourney", url: "https://www.midjourney.com", category: "image", pricing: "Subscription / credits", tags: "image,art,generative", desc: "AI art generator renowned for aesthetic, stylized image generation. Discord-based interface with subscription plans starting at $10/month."},
      {name: "Stable Diffusion", vendor: "Stability AI", url: "https://stability.ai", category: "image", pricing: "Open-source / commercial offerings", tags: "image,open-source,models", desc: "Open-source image generation model available for local deployment or via API. Foundation for many third-party AI image tools."},
      {name: "Adobe Firefly", vendor: "Adobe", url: "https://www.adobe.com/products/firefly.html", category: "image", pricing: "Creative Cloud / enterprise", tags: "image,design,creative-cloud", desc: "Adobe's generative AI integrated into Creative Cloud. Offers generative fill, expand, and style matching for photo and design work."},
      {name: "Runway", vendor: "Runway", url: "https://runwayml.com", category: "image", pricing: "Subscription", tags: "video,image,generative", desc: "Creative suite for AI video generation, editing, and effects. Features real-time video synthesis and professional-grade tools."},
      {name: "Leonardo.ai", vendor: "Leonardo", url: "https://leonardo.ai", category: "image", pricing: "Free / Paid", tags: "image,generative,art", desc: "AI image generation platform with style consistency and custom model training. Offers real-time generation and batch processing."},

      {name: "Jasper", vendor: "Jasper AI", url: "https://www.jasper.ai", category: "content", pricing: "Subscription", tags: "marketing,copywriting,content", desc: "AI content platform for generating marketing copy, blog posts, and brand messaging. Includes SEO optimization and brand voice management."},
      {name: "NotebookLM", vendor: "Google", url: "https://notebooklm.google.com", category: "content", pricing: "Free", tags: "research,notes,ai", desc: "AI research notebook for analyzing documents and generating insights. Converts source materials into study guides and podcast-style summaries."},
      {name: "ElevenLabs", vendor: "ElevenLabs", url: "https://elevenlabs.io", category: "content", pricing: "Free / Paid", tags: "voice,audio,tts", desc: "AI voice generation and text-to-speech platform. Offers realistic voice synthesis in multiple languages for content creators and developers."},

      {name: "Hugging Face", vendor: "Hugging Face", url: "https://huggingface.co", category: "platform", pricing: "Open / paid plans", tags: "models,hub,ml", desc: "Open-source platform and community hub for machine learning models. Hosts thousands of LLMs, vision models, and datasets."},
      {name: "Anthropic Console", vendor: "Anthropic", url: "https://console.anthropic.com", category: "platform", pricing: "Pay-as-you-go", tags: "api,models,platform", desc: "Hosted API platform for Claude models. Offers flexible pay-per-use pricing with adjustable rate limits and batch processing."}
    ];

    const listEl = document.getElementById('list');
    const sourcesEl = document.getElementById('sources-list');
    const qEl = document.getElementById('q');
    function render() {
      const q = qEl.value.trim().toLowerCase();
      listEl.innerHTML = '';
      const sources = new Map();
      data.forEach((item) => {
        if (currentCategory !== 'all' && item.category !== currentCategory) return;
        if (q && !`${item.name} ${item.vendor} ${item.tags||''} ${item.desc}`.toLowerCase().includes(q)) return;
        const art = document.createElement('article');
        art.className = 'card';
        art.innerHTML = `<h3><a href="${item.url}" target="_blank" rel="noopener">${item.name}</a></h3>
          <p class="meta">${item.vendor} — ${item.pricing || '—'}</p>
          <p>${item.desc || ''}</p>`;
        listEl.appendChild(art);
        if (item.source) sources.set(item.source, item.source);
      });
      sourcesEl.innerHTML = '';
      Array.from(sources.keys()).forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${s}" target="_blank" rel="noopener">${s}</a>`;
        sourcesEl.appendChild(li);
      });
    }
    let currentCategory = 'all';
    function setCategory(cat){ currentCategory = cat; render(); }
    qEl.addEventListener('input', render);
    render();
  </script>
</body>
</html>
